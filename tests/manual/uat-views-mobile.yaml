# Operator-assisted E2E: the board's views at a phone viewport.
#
# The harness mounts the actual app.tsx against the mocked SDK
# (scripts/screenshot) at 390×844 (iPhone-class). The full desktop sweep of
# views lives in uat-board-views.yaml; this suite proves the views that
# matter on a phone render as boards (not broken layouts), that opening a
# card produces the pane, and that the horizontal lane read (issue #153)
# works at phone width too.
#
# Run: npm run uat -- tests/manual/uat-views-mobile.yaml
suite: views-mobile
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5192
defaults:
  groupBy: status
  theme: dark
  viewport: { width: 390, height: 844 }

steps:
  - id: attention-renders-at-phone-width
    title: The Attention board renders its lanes at 390×844
    goto: "?groupBy=status"
    assert:
      - lane_direction: vertical
      - text_visible: "Unread"
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue, thr_review_pr]

  - id: a-card-click-opens-the-boards-pane
    title: Clicking a card opens its thread in the board's own pane at phone width
    # One click, one surface (issue #470): at the covered pane width the board
    # keeps to its own sheet, so the tap lands the thread in the board's pane
    # and the host's opener is never asked for a split.
    goto: "?groupBy=status"
    click: { card: thr_rpc_auth }
    assert:
      - native_panes: []
      - pane: { threadId: thr_rpc_auth }

  - id: escape-closes-the-phone-pane
    title: Escape closes the pane back onto the board
    # The pane enters by its deep link (the native-pane move); the compact
    # sheet and its Escape close are unchanged.
    goto: "?groupBy=status#/plugins/focus-board/board/t/thr_rpc_auth"
    press_escape: true
    assert:
      - pane: { open: false }

  - id: opening-an-unread-card-recenters-on-it
    title: Tapping an unread card leaves the board looking at it, in its idle lane
    # The 2026-11-18 phone report: opening a card from Unread moves it to its
    # idle lane but the board keeps its scroll, so the card the operator just
    # opened reads as vanished. At 390 the Unread lane starts past the fold, so
    # the premise is real: the card is offscreen before the click. Opening it
    # makes the host mark the thread read a beat later, which re-lanes the card
    # into its idle bucket at once (grouping's frozenLaneHolds, issue #338).
    # The covered sheet hides the board while it happens, so the step proves the
    # board settled by reading the offsets and the card's place in the board's
    # range, not by looking at the pane.
    goto: "?groupBy=status"
    assert_before_drag:
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue, thr_review_pr]
      - column_card_offscreen: thr_rpc_auth
    gestures:
      - click: { card: thr_rpc_auth }
      - push_update: { threadId: thr_rpc_auth, patch: { isUnread: false } }
    assert:
      - pane: { threadId: thr_rpc_auth }
      # The card left Unread for its idle bucket…
      - column_contains: { column: idle-recent, id: thr_rpc_auth }
      - column_contains: { column: unread, id: thr_rpc_auth, shown: false }
      # …and the board followed it there instead of resting on the old lane.
      - column_card_visible: thr_rpc_auth
      - scroll_offset: { target: board, axis: x, min: 1 }

  - id: recency-renders-its-buckets-at-phone-width
    title: The Last activity board renders its age buckets at phone width
    goto: "?groupBy=recency"
    assert:
      - text_visible: "Today"
      - text_visible: "A while ago"

  - id: horizontal-lane-rows-render-at-phone-width
    title: The horizontal lane read lays its rows out at phone width
    goto: "?groupBy=status&laneDirection=horizontal"
    assert:
      - lane_direction: horizontal
      - text_visible: "Unread"
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue, thr_review_pr]
      # The lane row holds its own horizontal scroll (the 160px header strip
      # plus a 240px card exceeds 390px), so a whole-card-in-board-viewport
      # assertion does not apply here: the row scrolls, the board doesn't.

  - id: group-view-renders-at-phone-width
    title: The Group view renders its buckets at phone width
    goto: "?groupBy=group"
    assert:
      - text_visible: "No group"
      - text_visible: "chat-imagegent"