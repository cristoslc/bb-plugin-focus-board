# Operator-assisted E2E: the card click's contract, fourth revision, after the
# operator's ruling dec_a4lrjn0gqqmk ("Navigate, then bring the board back").
#
# The measured host fact (scripts/screenshot/probe-split-dance.mjs, evidence in
# docs/screenshots/probe-split-dance/): a one-pane window ALREADY carries a
# one-pane layout, so bb's own opener splits it — the board keeps its pane and
# the thread arrives beside it, nothing unmounts. bb's plugin-facing layout
# hook reads null below two panes, which is why the click used to open the
# board's own in-panel pane instead of asking.
#
# The click still asks where the host cannot split (splits off, an older host),
# and then ends in the board's own pane: the ask's deadline is what keeps the
# thread on screen instead of losing it (lib/native-one-pane-dance.ts). The
# harness's default window models that state; `?nativeSplit=1` models a window
# whose own layout the host will split.
#
# Run: npm run uat -- tests/manual/uat-native-open.yaml
suite: native-open
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5183
defaults:
  groupBy: status
  theme: dark
  # A desktop window narrow enough that the board's lane row overflows: the
  # reported split bug needs an operator pan (a nonzero restored scroll) and a
  # card near the board's right edge, and a wider window leaves nothing to pan.
  viewport:
    width: 1280
    height: 800
steps:
  - id: a-one-pane-click-puts-the-thread-beside-the-board
    title: A card click in a one-pane window opens the thread beside the board
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - click: { card: thr_uat_queue }
    assert:
      # The ruling's call: the host's own opener, with placement.
      - native_open: { threadId: thr_uat_queue, split: true }
      # What the operator ends with: the thread in a native pane beside the
      # board, one window-wide pane pair, and no second thread surface inside
      # the board.
      - native_panes: [thr_uat_queue]
      - native_pane_count: 2
      - pane: { open: false }
      # The board is still the board: its columns render and its cards are on
      # screen, following the thread the host put beside it.
      - column_card_visible: thr_review_pr
      - active_card: { id: thr_uat_queue }

  - id: a-second-click-replaces-the-thread-in-that-pane
    title: A second card click replaces the thread in the pane, still two panes
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - click: { card: thr_uat_queue }
      - click: { card: thr_rpc_auth }
    assert:
      - native_panes: [thr_rpc_auth]
      - native_pane_count: 2
      - pane: { open: false }
      - native_route_fell_back: false

  # The reported regression (2026-11-21): "clicking on a card then opens the
  # legacy focus board thread pane instead of swapping the native one ... after
  # an action is taken in the native pane". A pane navigated from inside itself
  # (a mention, a child row, a sidebar row, `bb thread open`) stops matching the
  # board's `{paneId, threadId}` record, and the click used to answer that with
  # its own in-panel pane — the symptom, caught live with the click's trace
  # (docs/screenshots/probe-card-click-after-right-panel/). `?staleNativePane=1`
  # opens the window in that state; the click must keep the native surface.
  - id: a-stale-record-asks-for-a-fresh-pane-beside-the-board
    title: With its record stale, a card click opens a fresh native pane instead of the board's own
    goto: "?groupBy=status&nativeSplit=1&staleNativePane=1"
    gestures:
      - click: { card: thr_uat_queue }
      - sleep: 500
    assert:
      - native_open: { threadId: thr_uat_queue, split: true }
      # The operator's pane is untouched, and a second thread pane appeared
      # beside the board: three panes, never the board's own in-panel pane.
      - native_panes: [thr_uat_queue, thr_review_pr]
      - native_pane_count: 3
      - pane: { open: false }

  - id: the-fresh-pane-is-the-boards-from-the-next-click-on
    title: The pane a stale-record click created is replaced by the next card click
    goto: "?groupBy=status&nativeSplit=1&staleNativePane=1"
    gestures:
      - click: { card: thr_uat_queue }
      - sleep: 500
      - click: { card: thr_rpc_auth }
      - sleep: 500
    assert:
      - native_panes: [thr_rpc_auth, thr_review_pr]
      - native_pane_count: 3
      - pane: { open: false }

  # The reported regression (2026-11-20): "keeping the focused card in view (by
  # scrolling) isn't fully working in conjunction with the pane split". The
  # board is panned to a far-right lane, the card is clicked, and the split
  # halves the board. bb re-creates the panel in that same gesture, so the
  # restored scroll was captured at the wide width; the board must still leave
  # the card the click focused inside its visible range. The harness models the
  # host's split chrome and its panel re-creation for this path
  # (scripts/screenshot/mock-sdk.tsx).
  - id: the-clicked-card-stays-in-view-when-the-pane-splits
    title: A card clicked from a scrolled board stays inside the board after the native pane opens
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - scroll: { dx: 500, target: columns, settle_ms: 300 }
      - click: { card: thr_icon_lazy }
      - sleep: 800
    assert:
      - native_panes: [thr_icon_lazy]
      - native_pane_count: 2
      - column_card_visible: thr_icon_lazy

  # The other surface: the board's own in-panel pane narrows the board without
  # re-creating the panel, so the width observer is the fit. Pinned here so the
  # remount fix cannot quietly become the only branch that works.
  - id: the-clicked-card-stays-in-view-in-the-board-panel
    title: The same click with the board-panel answer keeps the card inside the narrowed board
    goto: "?groupBy=status&nativeSplit=1&firstRun=1"
    gestures:
      - click_aria: "In the board panel"
      - sleep: 300
      - scroll: { dx: 500, target: columns, settle_ms: 300 }
      - click: { card: thr_icon_lazy }
      - sleep: 800
    assert:
      - native_panes: []
      - native_pane_count: 1
      - pane: { threadId: thr_icon_lazy }
      - column_card_visible: thr_icon_lazy

  - id: a-click-with-splits-off-keeps-the-thread-in-the-board
    title: With splits off the click still asks, then keeps the thread in the board's own pane
    goto: "?groupBy=status"
    gestures:
      - click: { card: thr_uat_queue }
      # The ask's deadline: the host cannot split here, so the board's own
      # pane is what carries the thread about a quarter of a second later.
      - sleep: 400
    assert:
      - native_open: { threadId: thr_uat_queue, split: true }
      - native_panes: []
      - native_pane_count: 1
      - pane: { threadId: thr_uat_queue }
      - url: { suffix: "/board/t/thr_uat_queue" }

  - id: the-card-menu-open-thread-entry-rides-the-same-path
    title: The card menu's "Open thread" entry takes the same path
    goto: "?groupBy=status"
    menu: { card: thr_rpc_auth, item: "Open thread" }
    sleep: 400
    assert:
      - native_panes: []
      - pane: { threadId: thr_rpc_auth }

  - id: a-child-row-click-rides-the-same-path
    title: Clicking a nested child row opens that child beside the board
    goto: "?groupBy=status&nativeSplit=1"
    click: { card: thr_gutter_family_c0 }
    assert:
      - native_panes: [thr_gutter_family_c0]
      - native_pane_count: 2
      - pane: { open: false }
  # The setup question (server.ts `threadOpenTarget`, the dialog in
  # components/open-preference-dialog.tsx). `?firstRun=1` models an install that
  # has never answered: the harness's simulated settings store drops the key,
  # which is the dialog's own once-only marker. The harness CAN stage this run,
  # but not a second page load on the same store (the simulated store lives in
  # the page), so the once-only half is pinned by tests/app-open-preference.test.tsx
  # rather than here.
  - id: a-first-run-is-asked-where-threads-open
    title: A fresh install is asked where a card opens its thread, and the shipping answer is marked
    goto: "?groupBy=status&nativeSplit=1&firstRun=1"
    assert:
      - text_visible: "Where should threads open?"
      - text_visible: "Beside the board"
      - text_visible: "In the board panel"
      - text_visible: "Default"

  - id: the-board-panel-answer-keeps-the-click-in-the-board
    title: Choosing the board panel closes the question and every click stays in the board
    goto: "?groupBy=status&nativeSplit=1&firstRun=1"
    gestures:
      - click_aria: "In the board panel"
      - sleep: 300
      - click: { card: thr_uat_queue }
    assert:
      - text_hidden: "Where should threads open?"
      # The window could split here (`nativeSplit=1`): the opener is never asked,
      # no thread pane appears, and the board's own pane carries the thread.
      - native_panes: []
      - native_pane_count: 1
      - pane: { threadId: thr_uat_queue }

  # A thread CREATED inside the board (reported 2026-11-20). The board's own
  # New Thread modal is the composer; its spawn used to call the in-panel
  # opener directly, so a created thread always landed in the board whatever
  # the answer said. These two steps are the contract: the spawn takes the
  # same routing entry as a card click. The send button is the harness's mock
  # host composer (scripts/screenshot/mock-sdk.tsx), and `threads.spawn` adds
  # the created thread to the simulated sidebar so the board paints its card
  # exactly as a live spawn's row does.
  - id: a-thread-created-in-the-modal-opens-beside-the-board
    title: A thread created from the board's New Thread modal opens beside the board
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - click_aria: "New thread"
      - sleep: 300
      - click_aria: "Create thread"
    assert:
      - native_open: { threadId: thr_uat_spawned, split: true }
      - native_panes: [thr_uat_spawned]
      - native_pane_count: 2
      - pane: { open: false }

  - id: a-thread-created-in-the-modal-stays-in-the-board-when-that-is-the-answer
    title: With the board-panel answer, a created thread opens in the board's own pane
    goto: "?groupBy=status&nativeSplit=1&firstRun=1"
    gestures:
      - click_aria: "In the board panel"
      - sleep: 300
      - click_aria: "New thread"
      - sleep: 300
      - click_aria: "Create thread"
    assert:
      - native_panes: []
      - native_pane_count: 1
      - pane: { threadId: thr_uat_spawned }
      - url: { suffix: "/board/t/thr_uat_spawned" }
