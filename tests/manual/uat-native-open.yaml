# Operator-assisted E2E: the card click's current contract (2026-11-17, third
# revision after "still opening new, not replacing, panes").
#
# The rule (lib/native-pane-ownership.ts, docs/plans/2026-11-17-one-board-pane.md
# section 8): a native split is only asked for to focus or replace a pane the
# board can name. bb's `useSidebarSplitLayout()` answers null below two panes,
# which is where a fresh board starts, so a click from there opens the board's
# OWN in-panel pane: one pane, replaced in place, never one new host pane per
# click.
#
# The harness mounts the real app.tsx against the mocked SDK. What the mocked
# host cannot render is bb's own split, so the live side of the rule (a pane
# the board owns being replaced) is probe evidence in
# docs/screenshots/probe-native-one-click/, and the harness half pins what the
# panel itself does: no host open call, the board's pane opening, and the
# board's own route carrying the thread.
#
# Run: npm run uat -- tests/manual/uat-native-open.yaml
suite: native-open
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5183
defaults:
  groupBy: status
  theme: dark
steps:
  - id: a-card-click-opens-the-boards-own-pane
    title: Clicking a card opens the thread in the board's own pane, never a host split
    goto: "?groupBy=status&nativeSplit=1"
    click: { card: thr_uat_queue }
    assert:
      - native_panes: []
      - pane: { threadId: thr_uat_queue }
      - url: { suffix: "/board/t/thr_uat_queue" }

  - id: a-second-click-replaces-the-thread-in-that-pane
    title: A second card click replaces the thread in the board's pane, one pane only
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - click: { card: thr_uat_queue }
      - click: { card: thr_rpc_auth }
    assert:
      - native_panes: []
      - pane: { threadId: thr_rpc_auth }
      - url: { suffix: "/board/t/thr_rpc_auth" }
      - native_route_fell_back: false

  - id: a-third-click-still-leaves-one-pane
    title: A third card click still leaves one thread pane showing the last thread
    goto: "?groupBy=status&nativeSplit=1"
    gestures:
      - click: { card: thr_uat_queue }
      - click: { card: thr_rpc_auth }
      - click: { card: thr_review_pr }
    assert:
      - native_panes: []
      - pane: { threadId: thr_review_pr }

  - id: the-card-menu-open-thread-entry-rides-the-same-path
    title: The card menu's "Open thread" entry opens the same pane
    goto: "?groupBy=status&nativeSplit=1"
    menu: { card: thr_rpc_auth, item: "Open thread" }
    assert:
      - native_panes: []
      - pane: { threadId: thr_rpc_auth }

  - id: a-child-row-click-rides-the-same-path
    title: Clicking a nested child row opens that child in the board's pane
    goto: "?groupBy=status&nativeSplit=1"
    click: { card: thr_gutter_family_c0 }
    assert:
      - native_panes: []
      - pane: { threadId: thr_gutter_family_c0 }
