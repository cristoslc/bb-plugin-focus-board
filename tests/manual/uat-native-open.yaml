# Operator-assisted E2E: the card click's new contract — the native-pane
# move's step 3 (dec_nhnljjo8rgbz, docs/plans/2026-11-17-native-thread-pane.md
# §6.2). A card click calls the host's own opener
# (experimental_useSidebarThreadActions().open with split on) instead of
# opening the board's in-panel pane, so the thread opens in bb's native pane
# beside the board.
#
# The harness half pins the click's contract: the open call is recorded (the
# harness has no native pane to render), the board's own pane does NOT open,
# and the card menu's "Open thread" entry rides the same path. The live half
# — the split actually opening beside the board, an already-open thread
# focusing rather than duplicating, and the pane-cap fallback — is probe
# evidence in docs/screenshots/probe-native-split-pane/ plus the follow-up
# cap probe, not something the mocked harness can render.
#
# Run: npm run uat -- tests/manual/uat-native-open.yaml
suite: native-open
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5183
defaults:
  groupBy: status
  theme: dark
steps:
  - id: a-card-click-calls-the-native-opener-with-split
    title: Clicking a card opens the thread in bb's native pane beside the board
    goto: "?groupBy=status"
    click: { card: thr_uat_queue }
    assert:
      - native_open: { threadId: thr_uat_queue, split: true }
      - pane: { open: false }
  - id: the-card-menu-open-thread-entry-rides-the-same-path
    title: The card menu's "Open thread" entry opens the same native pane
    goto: "?groupBy=status"
    menu: { card: thr_rpc_auth, item: "Open thread" }
    assert:
      - native_open: { threadId: thr_rpc_auth, split: true }
      - pane: { open: false }
  - id: a-child-row-click-rides-the-same-path
    title: Clicking a nested child row opens that child in the native pane
    goto: "?groupBy=status"
    click: { card: thr_gutter_family_c0 }
    assert:
      - native_open: { threadId: thr_gutter_family_c0, split: true }
      - pane: { open: false }
