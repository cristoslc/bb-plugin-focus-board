# Operator-assisted E2E: parent-thread lanes.
#
# The harness mounts the actual app.tsx against the mocked SDK
# (scripts/screenshot), with the family fixtures (thr_parent_lane /
# thr_child_lane, thr_fam_*) plus the normal fixture threads. The suite
# exercises the ruler+wrap board: horizontal lanes are families, the locked
# "ruler" lane renders big readable cards while context lanes wrap compact
# cards, shared band heights per status row keep the left rail labels
# truthful, and horizontal panning re-locks the nearest lane at rest. Loose
# (unparented) threads render no lane at all.
#
# Run: npm run uat -- tests/manual/uat-parent-lanes.yaml
suite: parent-lanes
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5175
defaults:
  groupBy: parent
  theme: dark
  viewport: { width: 900, height: 640 }

steps:
  - id: parent-mode-renders-family-lanes-only
    title: Parent-thread grouping shows family lanes and excludes loose threads
    goto: "?groupBy=parent"
    assert:
      - text_visible: "Parent thread lane fixture"
      - text_visible: "Child thread lane fixture"
      - text_hidden: "Standalone"

  - id: ruler-lane-locked-with-aligned-bands
    title: The board opens with a family locked as the ruler lane and band tracks aligned
    goto: "?groupBy=parent"
    assert:
      - locked_lane: true
      - bands_aligned: true
      - nest_locked: true
      - text_hidden: "Standalone"

  - id: a-quarter-pan-selects-the-next-lane
    title: A short pan that mostly brings the next lane in locks that lane
    goto: "?groupBy=parent"
    scroll: { dx: 280 }
    sleep: { ms: 1600 }
    assert:
      - locked_lane: "thr_sweep_parent"
      - bands_aligned: true

  - id: hovering-a-swimlane-shades-the-whole-row
    title: Hovering a swimlane shades that row across every lane
    goto: "?groupBy=parent"
    hover: { board_y: 0.85 }
    assert:
      - band_hover: true

  - id: header-click-opens-parent-pane
    title: Clicking a lane header opens the parent thread's pane
    goto: "?groupBy=parent"
    click_aria: { label: "Open Parent thread lane fixture" }
    assert:
      - pane: { open: true }
      - text_visible: "Parent thread lane fixture"
      - url: { suffix: "/board/t/thr_parent_lane" }

  - id: card-click-opens-child-pane
    title: Clicking a child card opens its thread pane
    goto: "?groupBy=parent"
    click: { card: thr_child_lane }
    assert:
      - pane: { threadId: thr_child_lane }
      - active_card: { id: thr_child_lane }
      - url: { suffix: "/board/t/thr_child_lane" }

  - id: horizontal-scroll-keeps-active-lane-in-view
    title: A deep-linked child in the rightmost lane is scrolled into view
    goto: "?groupBy=parent#/plugins/focus-board/board/t/thr_child_lane"
    assert:
      - pane: { threadId: thr_child_lane }
      - active_card: { id: thr_child_lane, visible: true }

  - id: clicking-context-card-keeps-it-visible-after-relock
    title: Clicking a card in a context lane keeps it fully visible after the relock and recut
    goto: "?groupBy=parent"
    scroll: { dy: 260 }
    click: { card: thr_sweep_child }
    # The relock glides, the recut resizes bands, then the post-recut
    # corrections (flush drift + vertical bring-into-view) land at ~300ms.
    sleep: 1800
    assert:
      - locked_lane: thr_sweep_parent
      - card_visible: thr_sweep_child

  - id: horizontal-pan-relocks-nearest-family
    title: A horizontal pan releases the ruler lock and re-locks the nearest family at rest
    goto: "?groupBy=parent"
    scroll: { dx: 900 }
    assert:
      - locked_lane: true
      - bands_aligned: true

  - id: pan-settles-to-a-quiet-board
    title: After a pan the board settles quiet, bounded glide events then stillness
    goto: "?groupBy=parent"
    # The rule itself performs the pan and listens the whole way through
    # release, debounce, glide, recut, and post-pin corrections: the glide's
    # motion is legitimate (bounded event count), the jitter regression was
    # events continuing indefinitely to the end of the window.
    assert:
      - board_quiet: { dx: 480, hold_ms: 2500, max_events: 60, max_tail_ms: 500 }
      - locked_lane: true

  - id: wheel-pan-locks-and-quiets-like-a-trackpad
    title: A real wheel-event pan re-locks the nearest lane and settles quiet
    goto: "?groupBy=parent"
    # mode: wheel pans through the browser's input pipeline (real wheel
    # events, smooth-animated like a trackpad) instead of a scrollLeft
    # assignment — the same input path the operator's trackpad uses.
    assert:
      - board_quiet: { dx: 480, hold_ms: 2500, mode: wheel, max_events: 80, max_tail_ms: 500 }
      - locked_lane: true
      - bands_aligned: true

  - id: click-during-a-glide-wins-the-lock
    title: Clicking a family header while a pan glide is in flight locks THAT lane, not the pan's target
    goto: "?groupBy=parent"
    # The pan starts a glide toward the sweep family; the click (no settle
    # wait) lands while that glide is in flight and must win the lock back
    # for family A instead of the pan's target.
    scroll: { dx: 400, settle_ms: 0 }
    click_aria: { label: "Open Parent thread lane fixture" }
    sleep: 3000
    assert:
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: wheel-overshoot-snaps-back-to-the-locked-lane
    title: A small wheel overshoot inside the locked lane's grab window snaps back flush and keeps the lock
    goto: "?groupBy=parent"
    # One real wheel tick from the locked position overshoots ~130px into
    # the lane's own grab window; at rest the board must snap BACK to the
    # flush pin (no backward glide sweep, no off-flush resting position)
    # and keep the same lane locked.
    wheel_pan: { dx: 130, settle_ms: 2600 }
    assert:
      - locked_lane: "thr_parent_lane"
      - locked_flush: true
      - bands_aligned: true

  - id: viewport-resize-while-locked-stays-aligned
    title: Resizing the viewport wider while a lane is locked keeps the ruler locked and bands aligned
    goto: "?groupBy=parent"
    resize: { width: 1400, height: 800 }
    assert:
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: viewport-shrink-while-locked-stays-aligned
    title: Resizing the viewport narrower while a lane is locked keeps the ruler locked and bands aligned
    goto: "?groupBy=parent"
    resize: { width: 700, height: 640 }
    assert:
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: search-matching-only-loose-threads-shows-empty-state
    title: A search that matches only loose threads drops every family and shows the empty state
    goto: "?groupBy=parent&q=Queue%20the%20UAT%20pass%20for%20the%20rank%20lane"
    assert:
      - text_hidden: "Standalone"
      - text_hidden: "Queue the UAT pass for the rank lane"
      - text_visible: "No thread families to show yet"

  - id: lane-order-toggle-defaults-to-recency
    title: The lane-order toggle defaults to Recency in parent-thread mode
    goto: "?groupBy=parent"
    assert:
      - text_visible: "Recency"
      - text_visible: "Parent thread lane fixture"
      - text_hidden: "Standalone"

  - id: lane-order-toggle-switches-to-project
    title: Switching lane order to By project groups family lanes under their project
    goto: "?groupBy=parent"
    click_aria: { label: "By project" }
    assert:
      - text_visible: "By project"
      - text_visible: "Parent thread lane fixture"

  - id: lane-order-toggle-on-then-off
    title: Toggling lane order to By project then back to Recency keeps the board usable
    goto: "?groupBy=parent"
    click_aria: { label: "By project" }
    assert:
      - text_visible: "By project"
      - text_visible: "Parent thread lane fixture"

  - id: lane-order-toggle-back-to-recency
    title: Returning to Recency order removes project sections
    goto: "?groupBy=parent"
    click_aria: { label: "Recency" }
    assert:
      - text_visible: "Parent thread lane fixture"
      - text_hidden: "Standalone"

  - id: group-switch-back-to-attention
    title: Switching back to Attention grouping renders normal columns
    goto: "?groupBy=status"
    assert:
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue, thr_review_pr]