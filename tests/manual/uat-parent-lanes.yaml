# Operator-assisted E2E: parent-thread lanes.
#
# The harness mounts the actual app.tsx against the mocked SDK
# (scripts/screenshot), with the family fixtures (thr_parent_lane /
# thr_child_lane, thr_fam_*) plus the normal fixture threads. The suite
# exercises the ruler+wrap board: horizontal lanes are families, the locked
# "ruler" lane renders big readable cards while context lanes wrap compact
# cards, shared band heights per status row keep the left rail labels
# truthful, and horizontal panning re-locks the nearest lane at rest. Loose
# (unparented) threads render no lane at all.
#
# Run: npm run uat -- tests/manual/uat-parent-lanes.yaml
suite: parent-lanes
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5175
defaults:
  groupBy: parent
  theme: dark
  viewport: { width: 900, height: 640 }

steps:
  - id: parent-mode-renders-family-lanes-only
    title: Parent-thread grouping shows family lanes and excludes loose threads
    goto: "?groupBy=parent"
    assert:
      - text_visible: "Parent thread lane fixture"
      - text_visible: "Child thread lane fixture"
      - text_hidden: "Standalone"

  - id: ruler-lane-locked-with-aligned-bands
    title: The board opens with a family locked as the ruler lane and band tracks aligned
    goto: "?groupBy=parent"
    assert:
      - locked_lane: true
      - bands_aligned: true
      - nest_locked: true
      - text_hidden: "Standalone"

  - id: a-quarter-pan-selects-the-next-lane
    title: A short pan that mostly brings the next lane in locks that lane
    goto: "?groupBy=parent"
    scroll: { dx: 280 }
    sleep: { ms: 1600 }
    assert:
      - locked_lane: "thr_sweep_parent"
      - bands_aligned: true

  - id: hovering-a-swimlane-shades-the-whole-row
    title: Hovering a swimlane shades that row across every lane
    goto: "?groupBy=parent"
    hover: { board_y: 0.85 }
    assert:
      - band_hover: true

  - id: header-click-opens-the-parent-in-the-boards-pane
    title: Clicking a lane header opens the parent thread in the board's own pane
    # One click, one surface (issue #470): the click opens the board's own
    # in-panel pane. The header rides the same path a card click does (its
    # aria-label is the lane's own "Open …" control), so at one pane the host's
    # opener is never asked for a split, and the header's own lock comes with
    # the click. The header IS the parent's card in this view, so the pane's
    # title is the parent's display title.
    goto: "?groupBy=parent"
    click_aria: { label: "Open Parent thread lane fixture" }
    assert:
      - native_panes: []
      - pane: { open: true }
      - aria_present: "Thread: Parent thread lane fixture"
      - url: { suffix: "/board/t/thr_parent_lane" }
      - locked_lane: thr_parent_lane

  - id: card-click-opens-child-pane
    title: Clicking a child card opens its thread in the board's own pane
    # The same one-surface click a lane card takes: the board's pane carries
    # the child, and the child's family lane becomes the locked lane.
    goto: "?groupBy=parent"
    gestures:
      - click: { card: thr_child_lane }
      # This window has splits off, so the click asks the host and then opens
      # the board's own pane on the ask's deadline
      # (lib/native-one-pane-dance.ts).
      - sleep: 400
    assert:
      - native_panes: []
      - pane: { threadId: thr_child_lane }
      - active_card: { id: thr_child_lane }
      - url: { suffix: "/board/t/thr_child_lane" }
      - locked_lane: thr_parent_lane

  - id: horizontal-scroll-keeps-active-lane-in-view
    title: A deep-linked child in the rightmost lane is scrolled into view
    goto: "?groupBy=parent#/plugins/focus-board/board/t/thr_child_lane"
    assert:
      - pane: { threadId: thr_child_lane }
      - active_card: { id: thr_child_lane, visible: true }

  - id: a-context-lane-pan-locks-its-nearest-lane
    title: A short pan on the parent board locks the lane nearest the ruler
    # The pan runs with no pane open, so the board still has its full width
    # for it: the lock lands on the lane the pan brings to the ruler —
    # recorded here, then replaced by the click below.
    goto: "?groupBy=parent"
    scroll: { dy: 260 }
    sleep: 1800
    assert:
      - locked_lane: thr_parent_lane

  - id: clicking-a-context-card-locks-its-own-lane
    title: Clicking a card in a context lane opens it in the board's pane, relocks onto that lane, and keeps the card visible
    # The click sets the active thread, and this board's rule is that the
    # active thread's lane becomes the locked lane (the pane-open state the
    # one-surface contract restored). What this step has always guarded is the
    # card itself: through the relock glide and the recut that follows, the
    # clicked card stays fully visible, and the lock it leaves behind is that
    # card's own lane rather than the lane the pan before it held.
    click: { card: thr_sweep_child }
    sleep: 1800
    assert:
      - native_panes: []
      - pane: { threadId: thr_sweep_child }
      - locked_lane: thr_sweep_parent
      - card_visible: thr_sweep_child

  - id: horizontal-pan-relocks-nearest-family
    title: A horizontal pan releases the ruler lock and re-locks the nearest family at rest
    goto: "?groupBy=parent"
    scroll: { dx: 900 }
    assert:
      - locked_lane: true
      - bands_aligned: true

  - id: pan-settles-to-a-quiet-board
    title: After a pan the board settles quiet, bounded glide events then stillness
    goto: "?groupBy=parent"
    # The rule itself performs the pan and listens the whole way through
    # release, debounce, glide, recut, and post-pin corrections: the glide's
    # motion is legitimate (bounded event count), the jitter regression was
    # events continuing indefinitely to the end of the window.
    assert:
      - board_quiet: { dx: 480, hold_ms: 2500, max_events: 60, max_tail_ms: 500 }
      - locked_lane: true

  - id: wheel-pan-locks-and-quiets-like-a-trackpad
    title: A real wheel-event pan re-locks the nearest lane and settles quiet
    goto: "?groupBy=parent"
    # mode: wheel pans through the browser's input pipeline (real wheel
    # events, smooth-animated like a trackpad) instead of a scrollLeft
    # assignment — the same input path the operator's trackpad uses.
    assert:
      - board_quiet: { dx: 480, hold_ms: 2500, mode: wheel, max_events: 80, max_tail_ms: 500 }
      - locked_lane: true
      - bands_aligned: true

  - id: click-during-a-glide-opens-in-the-boards-pane
    title: Clicking a family header while a pan glide is in flight opens the thread in the board's pane and wins the lock for that lane
    goto: "?groupBy=parent"
    # The pan starts a glide toward the sweep family; the click (no settle
    # wait) lands while that glide is in flight. The header click locks its own
    # lane and sets the active thread, whose lane is locked too — the pane's own
    # entry is what carries the board to that lane. What must hold is the quiet
    # board: the clicked family holds the lock, the bands stay aligned, and the
    # thread lands in the board's pane rather than a host split.
    scroll: { dx: 400, settle_ms: 0 }
    click_aria: { label: "Open Parent thread lane fixture" }
    sleep: 3000
    assert:
      - native_panes: []
      - pane: { open: true }
      - aria_present: "Thread: Parent thread lane fixture"
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: wheel-overshoot-snaps-back-to-the-locked-lane
    title: A small wheel overshoot inside the locked lane's grab window snaps back flush and keeps the lock
    goto: "?groupBy=parent"
    # One real wheel tick from the locked position overshoots ~130px into
    # the lane's own grab window; at rest the board must snap BACK to the
    # flush pin (no backward glide sweep, no off-flush resting position)
    # and keep the same lane locked.
    wheel_pan: { dx: 130, settle_ms: 2600 }
    assert:
      - locked_lane: "thr_parent_lane"
      - locked_flush: true
      - bands_aligned: true

  - id: viewport-resize-while-locked-stays-aligned
    title: Resizing the viewport wider while a lane is locked keeps the ruler locked and bands aligned
    goto: "?groupBy=parent"
    resize: { width: 1400, height: 800 }
    assert:
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: viewport-shrink-while-locked-stays-aligned
    title: Resizing the viewport narrower while a lane is locked keeps the ruler locked and bands aligned
    goto: "?groupBy=parent"
    resize: { width: 700, height: 640 }
    assert:
      - locked_lane: thr_parent_lane
      - bands_aligned: true

  - id: search-matching-only-loose-threads-shows-empty-state
    title: A search that matches only loose threads drops every family and shows the empty state
    goto: "?groupBy=parent&q=Queue%20the%20UAT%20pass%20for%20the%20rank%20lane"
    assert:
      - text_hidden: "Standalone"
      - text_hidden: "Queue the UAT pass for the rank lane"
      - text_visible: "No thread families to show yet"

  - id: lane-order-toggle-defaults-to-recency
    title: The lane-order toggle defaults to Recency in parent-thread mode
    goto: "?groupBy=parent"
    assert:
      - text_visible: "Recency"
      - text_visible: "Parent thread lane fixture"
      - text_hidden: "Standalone"

  - id: lane-order-toggle-switches-to-project
    title: Switching lane order to By project groups family lanes under their project
    goto: "?groupBy=parent"
    click_aria: { label: "By project" }
    assert:
      - text_visible: "By project"
      - text_visible: "Parent thread lane fixture"

  - id: lane-order-toggle-on-then-off
    title: Toggling lane order to By project then back to Recency keeps the board usable
    goto: "?groupBy=parent"
    click_aria: { label: "By project" }
    assert:
      - text_visible: "By project"
      - text_visible: "Parent thread lane fixture"

  - id: lane-order-toggle-back-to-recency
    title: Returning to Recency order removes project sections
    goto: "?groupBy=parent"
    click_aria: { label: "Recency" }
    assert:
      - text_visible: "Parent thread lane fixture"
      - text_hidden: "Standalone"

  - id: group-switch-back-to-attention
    title: Switching back to Focus grouping renders normal columns
    goto: "?groupBy=status"
    assert:
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue, thr_review_pr]

  # The row sweep: the Parent view's horizontal bands each carry the same
  # sweep the Focus view's vertical columns do. The idle and Done rows are
  # the sweepable ones; Needs you and Working never sweep.
  - id: row-rail-carries-a-sweep-per-sweepable-row
    title: Each sweepable row's rail cell carries the sweep pill, and the non-sweepable rows carry none
    goto: "?groupBy=parent"
    assert:
      - parent_row_sweep: { row: idle-awhile, present: true, pill: "^\\d+$" }
      - parent_row_sweep: { row: done, present: true, pill: "^\\d+$" }
      # Needs you and Working sweep nothing: the row exists, with no pill.
      - parent_row_sweep: { row: attention, present: false }
      - parent_row_sweep: { row: working, present: false }

  - id: arming-an-idle-row-preselects-the-aged-out-cards
    title: Clicking the idle row's broom arms the row and highlights its aged-out cards across every family lane
    goto: "?groupBy=parent"
    click_row_sweep: { row: idle-awhile }
    assert:
      - parent_row_sweep: { row: idle-awhile, armed: true, pill: "^\\d+ → Done$", cancel: true }
      # The preselect spans lanes: one aged-out card in each of these
      # families' idle cells lights up from the ONE row gesture.
      - parent_row_sweep_lanes: { thr_sweep_parent: 1, thr_proj_family: 1 }
      # A working child of the sweep family never joins a removing sweep.
      - parent_row_sweep: { row: idle-awhile, excludes: [thr_sweep_w0, thr_sweep_w3] }

  - id: confirming-an-idle-row-sweep-marks-done
    title: Confirming the armed idle row writes the same done_set the Focus view's idle column writes
    goto: "?groupBy=parent"
    # Gestures run in array order: arm (first click), then confirm (second).
    gestures:
      - click_row_sweep: { row: idle-awhile }
      - click_row_sweep: { row: idle-awhile }
    assert:
      - rpc_called_method: done_set
      - sweep_done_set: { done: true }
      # The run drained the preselect: the row is idle again, nothing armed.
      - parent_row_sweep: { row: idle-awhile, armed: false }
      # The swept child left the idle row (it is Done now), and no working
      # card of its family was ever touched by the row's sweep.
      - parent_row_sweep: { row: idle-awhile, excludes: [thr_sweep_child] }
      - parent_row_sweep: { row: working, present: false }

  - id: arming-the-done-row-names-archive
    title: Arming the Done row's sweep names the Archive destination and offers the exit
    goto: "?groupBy=parent"
    click_row_sweep: { row: done }
    assert:
      - parent_row_sweep: { row: done, armed: true, pill: "1 → Archive", cancel: true }

  - id: confirming-the-done-row-sweep-archives
    title: Confirming the Done row's sweep archives its aged-out done child, the Focus view's Done-column destination
    goto: "?groupBy=parent"
    gestures:
      - click_row_sweep: { row: done }
      - click_row_sweep: { row: done }
    assert:
      # thr_proj_done is the family's done child: the one done card living in
      # a family lane, and the one thread the Focus view's Done column would
      # sweep for these rows.
      - sweep_archived: [thr_proj_done]
      - parent_row_sweep: { row: done, armed: false, pill: "^$" }

  - id: a-card-in-the-armed-row-toggles-the-selection
    title: Clicking a card inside the armed row curates the sweep instead of disarming it
    goto: "?groupBy=parent"
    click_row_sweep: { row: idle-awhile }
    click: { card: thr_sweep_child }
    assert:
      # Toggled out of the selection (the row stays armed, the clicked card
      # is no longer highlighted) and the click never opened its pane.
      - parent_row_sweep: { row: idle-awhile, armed: true, excludes: [thr_sweep_child] }
      - pane: { open: false }
