suite: pane-archive
harness:
  config: scripts/screenshot/vite.config.ts
  port: 5182
defaults:
  groupBy: status
  theme: dark
steps:
  - id: open-the-pane
    title: The pane opens on the thread (deep-linked; card clicks open bb's own pane now)
    # The native-pane move: the pane is entered by its deep link, the same
    # state a shared URL lands on.
    goto: "?groupBy=status#/plugins/focus-board/board/t/thr_review_pr"
    assert:
      - pane: { threadId: thr_review_pr }
      - text_visible: "Review PR #14"
  - id: archive-from-the-pane-actions
    title: Archive in the pane's actions menu removes the card from the board; the pane stays open on the archived thread
    gestures:
      - click_aria: { label: "More thread actions" }
      - click_aria: { label: "Archive" }
    assert:
      - pane: { open: true }
      - text_visible: "Review PR #14"
      - column: unread
        ordered: [thr_rpc_auth, thr_uat_queue]
  - id: the-archived-row-offers-unarchive
    title: An archived row's menu keeps its Unarchive (its only way out) and drops the Pin entry
    gestures:
      - click_aria: { label: "More thread actions" }
    assert:
      - text_visible: "Unarchive"
  - id: mark-done-from-the-pane-header-closes-the-pane
    title: Mark Done in the pane header closes the pane, and the card it moved is in the Done lane
    # The same header control, the other side of the rule: Archive above stays
    # in the pane it acted on, and Mark Done closes it. Done puts the card at
    # the top of the Done lane, so the close is what shows it to the operator
    # (the operator's ask of 2026-11-24).
    goto: "?groupBy=status#/plugins/focus-board/board/t/thr_uat_queue"
    gestures:
      - click_aria: { label: "Focus Board thread menu" }
      - click_aria: { label: "Mark Done" }
    assert:
      - pane: { open: false }
      - column_contains: { column: done, id: thr_uat_queue }
      - no_visible_error: true
