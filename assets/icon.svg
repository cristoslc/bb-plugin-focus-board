<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Focus Board brand mark ("inverted lane, one card"): the kanban
       chassis flush at the top, the right lane riding short. The two
       side lanes are dim solid fills (55% alpha, no outline strokes);
       the middle lane is INVERTED — filled solid so it reads as the lit
       lane — with one card punched through as a true evenodd hole, so
       the surface behind shows through on every theme with no fixed
       hexes. No pupil, no eye, no card stack. bb renders plugin icons as
       CSS masks keyed off alpha coverage: solid fills + one honest hole
       are exactly what the pipeline survives, and the theme inversion
       rides the mask (currentColor tints per row), so one asset serves
       light and dark. -->
  <path d="M3.25 4.5H7.25V19.5H3.25Z" opacity=".55" fill="currentColor"/>
  <path d="M16.75 4.5H20.75V16.5H16.75Z" opacity=".55" fill="currentColor"/>
  <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M9.25 4.5H14.75V19.5H9.25Z M11.45 9.5H12.55A1 1 0 0 1 13.55 10.5V13.5A1 1 0 0 1 12.55 14.5H11.45A1 1 0 0 1 10.45 13.5V10.5A1 1 0 0 1 11.45 9.5Z"/>
</svg>