<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Focus Board brand mark ("focal card triptych"): the plain kanban
       chassis — three outlined columns, all flush at the top, the right
       one riding short — with a single solid card sitting in the middle
       column, tall and near the top, the way real lanes fill. The card is
       the only solid form: "the card that needs you." No pupil, no eye,
       no punched holes — one strong alpha shape among bold outlines is
       what survives bb's alpha-mask pipeline at 16px. -->
  <path d="M3.25 4.5H7.25V19.5H3.25Z" stroke="currentColor" stroke-width="2.5"/>
  <path d="M16.75 4.5H20.75V16.5H16.75Z" stroke="currentColor" stroke-width="2.5"/>
  <path d="M9.25 4.5H14.75V19.5H9.25Z" stroke="currentColor" stroke-width="2.5"/>
  <rect x="10.5" y="6.4" width="3" height="7" rx="1.3" fill="currentColor"/>
</svg>